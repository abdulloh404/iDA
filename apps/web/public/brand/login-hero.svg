<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice" role="presentation">
  <title>ภาพประกอบแถบแบรนด์ iDA</title>

  

  <defs>
    
    <linearGradient id="brand" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00509E" />
      <stop offset="32%" stop-color="#0A6FB8" />
      <stop offset="64%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#48C774" />
    </linearGradient>

    
    <linearGradient id="stripeFade" x1="0%" y1="0%" x2="100%" y2="0%">
