name: ida

x-runtime: &runtime
  init: true
  restart: unless-stopped
  networks:
    - backend

x-api-environment: &api-environment
  DOTNET_ENVIRONMENT: Production
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://0.0.0.0:8080
  Api__Core__Url: http://core-api:8080
  Api__ServiceKey: ${IDA_SERVICE_API_KEY:?Set IDA_SERVICE_API_KEY}
  Api__KnownProxies__0: ${NGINX_IP:-172.30.0.2}
  Jwt__Key: ${JWT_KEY:?Set JWT_KEY}
  Jwt__Issuer: ${JWT_ISSUER:-ida-api}
  Jwt__Audience: ${JWT_AUDIENCE:-ida-web}
  Security__DataProtectionKey: ${DATA_PROTECTION_KEY:?Set DATA_PROTECTION_KEY}
  Security__HashSalt: ${HASH_SALT:?Set HASH_SALT}

x-tenant-image: &tenant-image
  image: ida-tenant-api:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deployment/production.Dockerfile
    target: tenant-api

x-ingest-image: &ingest-image
  profiles:
    - ingest
  image: ida-ingest:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deployment/production.Dockerfile
    target: ingest

services:
  nginx:
    <<: *runtime
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      BU01_API_PATH: ${BU01_API_PATH:-/pt1}
      BU02_API_PATH: ${BU02_API_PATH:-/pt2}
      NGINX_ENVSUBST_FILTER: '^(SERVER_NAME|HTTPS_PORT|BU01_API_PATH|BU02_API_PATH)$$'
    volumes:
      - type: bind
        source: ./nginx.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_CERTIFICATE_PATH:?Set TLS_CERTIFICATE_PATH}
        target: /etc/nginx/certs/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_PRIVATE_KEY_PATH:?Set TLS_PRIVATE_KEY_PATH}
        target: /etc/nginx/certs/tls.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - web
      - core-api
      - tenant-bu01
      - tenant-bu02
    networks:
      backend:
        ipv4_address: ${NGINX_IP:-172.30.0.2}

  web:
    <<: *runtime
    image: ida-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/production.Dockerfile
      target: web

  core-api:
    <<: *runtime
    image: ida-core-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/production.Dockerfile
      target: core-api
    environment:
      <<: *api-environment
      Api__Mode: Core
      Api__PathBase: /core
      ConnectionStrings__Core: ${CORE_DB_CONNECTION:?Set CORE_DB_CONNECTION}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD}
      CORE_DB_SCHEMA: core
      Api__Tenants__BU01__Url: http://tenant-bu01:8080
      Api__Tenants__BU01__PathBase: ${BU01_API_PATH:-/pt1}
      Api__Tenants__BU02__Url: http://tenant-bu02:8080
      Api__Tenants__BU02__PathBase: ${BU02_API_PATH:-/pt2}

  tenant-bu01:
    <<: [*runtime, *tenant-image]
    environment:
      <<: *api-environment
      Api__Mode: Tenant
      Api__BuId: BU01
      Api__PathBase: ${BU01_API_PATH:-/pt1}
      ConnectionStrings__BU01: ${BU01_DB_CONNECTION:?Set BU01_DB_CONNECTION}
      BU01_DB_PASSWORD: ${BU01_DB_PASSWORD:?Set BU01_DB_PASSWORD}
      BU01_HOSPITAL_ID: ${BU01_HOSPITAL_ID:-BU01}
      BU01_DB_SCHEMA: bu

  tenant-bu02:
    <<: [*runtime, *tenant-image]
    environment:
      <<: *api-environment
      Api__Mode: Tenant
      Api__BuId: BU02
      Api__PathBase: ${BU02_API_PATH:-/pt2}
      ConnectionStrings__BU02: ${BU02_DB_CONNECTION:?Set BU02_DB_CONNECTION}
      BU02_DB_PASSWORD: ${BU02_DB_PASSWORD:?Set BU02_DB_PASSWORD}
      BU02_HOSPITAL_ID: ${BU02_HOSPITAL_ID:-BU02}
      BU02_DB_SCHEMA: bu

  ingest-bu01:
    <<: [*runtime, *ingest-image]
    environment:
      DOTNET_ENVIRONMENT: Production
      Api__BuId: BU01
      ConnectionStrings__BU01: ${BU01_DB_CONNECTION:?Set BU01_DB_CONNECTION}
      BU01_DB_PASSWORD: ${BU01_DB_PASSWORD:?Set BU01_DB_PASSWORD}
      BU01_HOSPITAL_ID: ${BU01_HOSPITAL_ID:-BU01}
      BU01_DB_SCHEMA: bu

  ingest-bu02:
    <<: [*runtime, *ingest-image]
    environment:
      DOTNET_ENVIRONMENT: Production
      Api__BuId: BU02
      ConnectionStrings__BU02: ${BU02_DB_CONNECTION:?Set BU02_DB_CONNECTION}
      BU02_DB_PASSWORD: ${BU02_DB_PASSWORD:?Set BU02_DB_PASSWORD}
      BU02_HOSPITAL_ID: ${BU02_HOSPITAL_ID:-BU02}
      BU02_DB_SCHEMA: bu

networks:
  backend:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}
