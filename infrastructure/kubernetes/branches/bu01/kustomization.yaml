apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bu01
resources:
  - namespace.yaml
  - ../../base/worker
  - ../../base/database
configMapGenerator:
  - name: worker-config
    behavior: merge
    literals:
      - Bu__Id=BU01
      - Bu__QueueName=jobs.bu01
  - name: database-config
    behavior: merge
    literals:
      - POSTGRES_DB=ida_bu01
      - APP_DB_USER=bu01user
