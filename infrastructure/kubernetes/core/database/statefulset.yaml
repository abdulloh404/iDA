apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: core-db
  labels:
    ida.io/storage: local
spec:
  serviceName: core-db
  replicas: 1
  selector:
    matchLabels:
      app: core-db
  template:
    metadata:
      labels:
        app: core-db
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: core-database-secrets
                  key: POSTGRES_PASSWORD
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: core-database-secrets
                  key: APP_DB_PASSWORD
          envFrom:
            - configMapRef:
                name: core-database-config
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready --host=127.0.0.1 --port=5432 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready --host=127.0.0.1 --port=5432 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: core-database-init
              mountPath: /docker-entrypoint-initdb.d/init-database.sh
              subPath: init-database.sh
              readOnly: true
            - name: postgresql-run
              mountPath: /var/run/postgresql
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: core-database-init
          configMap:
            name: core-database-init
            defaultMode: 0555
        - name: postgresql-run
          emptyDir: {}
        - name: temporary
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
