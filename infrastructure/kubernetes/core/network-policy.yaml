apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-api-isolation
spec:
  podSelector:
    matchLabels:
      app: core-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
        - namespaceSelector:
            matchLabels:
              ida.io/role: bu
          podSelector:
            matchLabels:
              app: bu-worker
      ports:
        - protocol: TCP
          port: 3100
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: core-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: queue
      ports:
        - protocol: TCP
          port: 5672
