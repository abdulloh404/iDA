apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: queue-isolation
spec:
  podSelector:
    matchLabels:
      app: queue
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: core-api
        - namespaceSelector:
            matchLabels:
              ida.io/role: bu
          podSelector:
            matchLabels:
              app: bu-worker
      ports:
        - protocol: TCP
          port: 5672
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
