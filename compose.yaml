name: ida
x-worker: &worker
  image: ida/bu-worker:dev
  build:
    context: .
    dockerfile: apps/api/background-worker/Dockerfile
  environment: &worker-environment
    DOTNET_ENVIRONMENT: Production
    Core__BaseUrl: http://core-api:3100
  depends_on:
    - core-api
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  networks:
    - backend

services:
  core-api:
    image: ida/core-api:dev
    build:
      context: .
      dockerfile: apps/api/core-api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "3100"
      ConnectionStrings__Core: '${CORE_DB_CONNECTION:?Set CORE_DB_CONNECTION in .env};Password="${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in .env}"'
      Queue__ConnectionString: ${CORE_QUEUE_CONNECTION:?Set CORE_QUEUE_CONNECTION in .env}
    ports:
      - "127.0.0.1:${API_PORT:-3100}:3100"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - backend

  web:
    image: ida/web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - backend

  bu01-worker:
    <<: *worker
    environment:
      <<: *worker-environment
      Bu__Id: BU01
      Bu__QueueName: jobs.bu01
      ConnectionStrings__Bu: '${BU01_DB_CONNECTION:?Set BU01_DB_CONNECTION in .env};Password="${BU01_DB_PASSWORD:?Set BU01_DB_PASSWORD in .env}"'
      Queue__ConnectionString: ${BU01_QUEUE_CONNECTION:?Set BU01_QUEUE_CONNECTION in .env}

  bu02-worker:
    <<: *worker
    environment:
      <<: *worker-environment
      Bu__Id: BU02
      Bu__QueueName: jobs.bu02
      ConnectionStrings__Bu: '${BU02_DB_CONNECTION:?Set BU02_DB_CONNECTION in .env};Password="${BU02_DB_PASSWORD:?Set BU02_DB_PASSWORD in .env}"'
      Queue__ConnectionString: ${BU02_QUEUE_CONNECTION:?Set BU02_QUEUE_CONNECTION in .env}

  bu03-worker:
    <<: *worker
    environment:
      <<: *worker-environment
      Bu__Id: BU03
      Bu__QueueName: jobs.bu03
      ConnectionStrings__Bu: '${BU03_DB_CONNECTION:?Set BU03_DB_CONNECTION in .env};Password="${BU03_DB_PASSWORD:?Set BU03_DB_PASSWORD in .env}"'
      Queue__ConnectionString: ${BU03_QUEUE_CONNECTION:?Set BU03_QUEUE_CONNECTION in .env}

networks:
  backend:
    driver: bridge
